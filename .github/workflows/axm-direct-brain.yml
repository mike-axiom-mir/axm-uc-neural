name: AXM direct brain

on:
  push:
    paths:
      - "neural/axm_brain/**"
      - ".github/workflows/axm-direct-brain.yml"
  pull_request:
    paths:
      - "neural/axm_brain/**"
      - ".github/workflows/axm-direct-brain.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run AXM direct brain tests
        run: PYTHONPATH=. python -m unittest discover -s neural/axm_brain/tests -v
