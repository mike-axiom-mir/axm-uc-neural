name: Candidate adoption resume

on:
  push:
    branches:
      - automation/state-architect-idempotent-candidate-adoption-20260911
  pull_request:

permissions:
  contents: read

jobs:
  candidate-adoption-resume:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile adoption boundary and regressions
        run: python -m compileall -q src/axm_uc/machine.py tests/test_candidate_adoption_resume.py
      - name: Prove interrupted adoption resumes from canonical state
        run: python -m unittest -v tests.test_candidate_adoption_resume
      - name: Run complete repository gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python tools/build.py
      - name: Check whitespace against event base
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$DIFF_BASE" || "$DIFF_BASE" =~ ^0+$ ]]; then
            DIFF_BASE=$(git hash-object -w -t tree --stdin < /dev/null)
          fi
          git diff --check "$DIFF_BASE" HEAD
