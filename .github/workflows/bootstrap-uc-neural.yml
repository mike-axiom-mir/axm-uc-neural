name: Bootstrap UC + clean WALDO neural substrate

on:
  push:
    branches:
      - codex/uc-neural-bootstrap-v1
    paths:
      - .github/workflows/bootstrap-uc-neural.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize pinned source snapshots
        shell: bash
        run: |
          set -euo pipefail

          UC_SHA="08cd56220b927ff03432122c4470031597f9f697"
          WALDO_SHA="bc6bfe6cb85f27ff6cbbb4577542ed3bfc764fb7"

          git clone --quiet https://github.com/mike-axiom-mir/axm-universal-creation.git "$RUNNER_TEMP/uc"
          git -C "$RUNNER_TEMP/uc" checkout --quiet "$UC_SHA"

          git clone --quiet https://github.com/mike-axiom-mir/waldo-axm-mirror-research.git "$RUNNER_TEMP/waldo"
          git -C "$RUNNER_TEMP/waldo" checkout --quiet "$WALDO_SHA"

          # UC is the upper/root software body. Preserve its tracked bytes exactly.
          rsync -a --delete --exclude='.git' "$RUNNER_TEMP/uc/" ./

          # WALDO is kept intact beneath the neural layer so its training/model
          # contracts and provenance stay coherent. No learned state is imported.
          mkdir -p neural/waldo
          rsync -a --delete --exclude='.git' "$RUNNER_TEMP/waldo/" neural/waldo/

          cat > UC_NEURAL_EXPERIMENT.md <<'EOF'
          # AXM UC / Neural Experiment

          This repository is the clean baseline for the experiment:

          ```
          AXM Universal Creation
          └── neural/
              └── waldo/
          ```

          ## Layer boundary

          - **Upper layer — UC:** an exact tracked-file snapshot of AXM Universal Creation.
          - **Lower layer — WALDO neural substrate:** a clean code snapshot beneath `neural/waldo/`.
          - **No learned state imported:** no model weights, checkpoints, generated model state, or prior experience are seeded into this repository.
          - **No hidden coupling yet:** this bootstrap establishes the physical/source boundary only. Any UC ↔ neural bridge must be explicit, inspectable, testable, and added as a later change.
          - **UC remains usable without the neural layer.** The neural layer may learn from approved experience later, but must not silently become the owner of UC capabilities or canonical truth.

          ## Pinned source state

          Exact source commits are recorded in `SOURCE_SNAPSHOTS.json`.

          ## Licensing / provenance

          The root UC snapshot keeps its own license and provenance files. The nested WALDO snapshot keeps its own `LICENSE`, `LICENSE_BOUNDARY.md`, `NOTICE`, `THIRD_PARTY.json`, and source notices. Nesting the WALDO source here does **not** relicense it under the UC root license.

          ## First experiment rule

          Start from this clean baseline. Let experience create the difference; do not fake a trained brain by importing old checkpoints.
          EOF

          cat > neural/README.md <<'EOF'
          # Neural layer

          `waldo/` is a pinned, clean WALDO code substrate placed below AXM Universal Creation for the UC/neural experiment.

          Clean means **code and declared source contracts only**. This bootstrap intentionally imports no learned weights, checkpoints, model cache, generated run state, or prior experience.

          The full WALDO source snapshot is retained rather than cherry-picking a few model files so its training lifecycle, verification, provenance, export, and dependency boundaries remain inspectable.

          The first integration bridge is intentionally not invented here. A later change can define how UC emits experience, what the neural side is allowed to learn from it, how outputs return upward, and which state is authoritative.
          EOF

          cat > SOURCE_SNAPSHOTS.json <<EOF
          {
            "schema": 1,
            "created_for": "axm-uc-neural clean baseline",
            "upper_layer": {
              "name": "AXM Universal Creation",
              "repository": "mike-axiom-mir/axm-universal-creation",
              "commit": "$UC_SHA",
              "placement": "/",
              "tracked_files": $(git -C "$RUNNER_TEMP/uc" ls-files | wc -l)
            },
            "lower_layer": {
              "name": "WALDO AXM/Mirror research fork",
              "repository": "mike-axiom-mir/waldo-axm-mirror-research",
              "commit": "$WALDO_SHA",
              "placement": "neural/waldo/",
              "tracked_files": $(git -C "$RUNNER_TEMP/waldo" ls-files | wc -l),
              "learned_state_imported": false
            }
          }
          EOF

          # Byte-compare every tracked source file against the copied snapshot.
          while IFS= read -r f; do
            cmp -s "$RUNNER_TEMP/uc/$f" "./$f" || {
              echo "UC copy mismatch: $f" >&2
              exit 1
            }
          done < <(git -C "$RUNNER_TEMP/uc" ls-files)

          while IFS= read -r f; do
            cmp -s "$RUNNER_TEMP/waldo/$f" "neural/waldo/$f" || {
              echo "WALDO copy mismatch: $f" >&2
              exit 1
            }
          done < <(git -C "$RUNNER_TEMP/waldo" ls-files)

          # Refuse accidental learned-state seeding in the clean baseline.
          if find neural/waldo -type f \( -iname '*.safetensors' -o -iname '*.gguf' -o -iname '*.pt' -o -iname '*.pth' -o -iname '*.ckpt' -o -iname '*.npz' -o -iname '*.npy' \) -print -quit | grep -q .; then
            echo "Unexpected model/checkpoint artifact found in clean WALDO snapshot." >&2
            exit 1
          fi

          git status --short

      - name: Commit clean baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AXM bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "bootstrap: pin UC over clean WALDO neural substrate [skip ci]"
          git push origin HEAD:codex/uc-neural-bootstrap-v1
